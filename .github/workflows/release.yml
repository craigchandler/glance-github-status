name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="github-status-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${NAME}" ./cmd/github-status
          sha256sum "dist/${NAME}" > "dist/${NAME}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: github-status-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/github-status-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/github-status-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: github-status-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            github-status-linux-amd64
            github-status-linux-amd64.sha256
            github-status-linux-arm64
            github-status-linux-arm64.sha256
